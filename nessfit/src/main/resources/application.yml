spring:
  application:
    name: nessfit
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger-ui

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    issuer: nessfit
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  auth:
    refresh-cookie:
      secure: false
